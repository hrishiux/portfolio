<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Playground — Hrishikesh Nanda</title>
<!-- Preview only (2026-11-11, v4). A meadow you pan around, drawn in canvas, with toys in it.
     v4 per his notes on v3: sandbox (5) and dominoes (9) removed; the garage's λ game replaced by
     start-and-rev with engine sound synthesised live (Web Audio worklet: turbo 4, NA 4, single);
     signs made smaller, with the instructions shown only for the toy you're looking at.
     Toy numbers keep their v3 numbering while he picks. v3 is kept at _playground-v3.html.
     ?debug exposes state as window.__pg (with step(n)). Sign, tag and menu text is a placeholder of mine. -->
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap">
<style>
  :root{
    --ink:#10282b; --ink-2:#47605f; --cream:#fbf7ea; --glass:rgb(251 247 234 / .88); --line:rgb(16 40 43 / .14);
    --teal:#2bb0ae; --deep:#2f5d5c; --coral:#f2785c;
    --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html, body{ height:100%; overflow:hidden; background:#2f6a46; color:var(--ink); font-family:var(--display) }
  #world{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none }
  #world.is-panning{ cursor:grabbing }
  #world.is-hot{ cursor:pointer }

  .hud{ position:fixed; z-index:5; display:flex; align-items:center; gap:.5rem; pointer-events:none }
  .hud > *{ pointer-events:auto }
  .pill{
    display:inline-flex; align-items:center; gap:.5rem;
    background:var(--glass); border:1px solid var(--line); border-radius:999px;
    -webkit-backdrop-filter:blur(10px) saturate(1.1); backdrop-filter:blur(10px) saturate(1.1);
    box-shadow:0 6px 20px -12px rgb(10 40 30 / .45);
  }
  .top{ top:max(14px, env(safe-area-inset-top)); left:16px; right:16px; justify-content:space-between }
  .mark{ padding:.5rem 1rem .55rem; color:var(--ink); text-decoration:none; font-weight:800; font-style:italic; font-size:1.15rem; letter-spacing:-.03em }
  .mark small{ font:500 .7rem/1 var(--mono); font-style:normal; letter-spacing:.14em; color:var(--ink-2); padding-left:.6rem; border-left:1px solid var(--line) }
  .right{ display:flex; gap:.5rem }
  /* 14 Nov, his note: say the playground is still a work in progress */
  .left{ display:flex; align-items:center; gap:.5rem; min-width:0 }
  .wip{ padding:.5rem .85rem; font:500 .7rem/1.2 var(--mono); letter-spacing:.08em; color:var(--cream); background:var(--ink); border-color:var(--ink); white-space:nowrap }
  @media (max-width:720px){ .top{ align-items:flex-start } .left{ flex-direction:column; align-items:flex-start } .wip{ padding:.4rem .7rem; font-size:.625rem } .mark small{ display:none } .hud.hint, .hud.toast{ top:calc(max(14px, env(safe-area-inset-top)) + 100px) } }
  .links{ padding:.35rem .5rem }
  .links a, .sound{ font:500 .72rem/1 var(--mono); letter-spacing:.12em; color:var(--ink); text-decoration:none; padding:.45rem .6rem; border-radius:999px }
  .links a:hover{ background:rgb(16 40 43 / .07) }
  .sound{ border:1px solid var(--line); background:var(--glass); cursor:pointer; padding:.62rem .85rem; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
  .sound[aria-pressed="false"]{ color:var(--ink-2); text-decoration:line-through }

  .hint{ top:calc(max(14px, env(safe-area-inset-top)) + 58px); left:50%; transform:translateX(-50%); transition:opacity .5s ease }
  .hint .pill{ padding:.5rem .9rem; font:500 .72rem/1.3 var(--mono); letter-spacing:.08em; color:var(--ink-2); white-space:nowrap }
  .hint.is-gone{ opacity:0; pointer-events:none }
  .hint.is-gone > *{ pointer-events:none }
  .toast{ top:calc(max(14px, env(safe-area-inset-top)) + 58px); left:50%; transform:translate(-50%, -8px); opacity:0; transition:opacity .25s ease, transform .25s ease }
  .toast .pill{ padding:.6rem 1.05rem; font-weight:700; font-style:italic; font-size:1rem; letter-spacing:-.01em; background:var(--ink); color:var(--cream); border-color:var(--ink); white-space:nowrap }
  .toast.is-on{ opacity:1; transform:translate(-50%, 0) }

  /* toys menu */
  .dock{ left:16px; bottom:max(16px, env(safe-area-inset-bottom)); flex-direction:column; align-items:flex-start }
  .toys-btn{ font:700 .95rem/1 var(--display); font-style:italic; letter-spacing:-.01em; color:var(--cream); background:var(--ink); border:1px solid var(--ink); border-radius:999px; padding:.75rem 1.1rem; cursor:pointer; box-shadow:0 10px 24px -12px rgb(10 30 30 / .6) }
  .toys-btn span{ font:500 .7rem/1 var(--mono); font-style:normal; letter-spacing:.1em; opacity:.75; margin-left:.35rem }
  .toys{ width:min(340px, calc(100vw - 32px)); max-height:min(70vh, 640px); overflow:auto; background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:.5rem; box-shadow:0 24px 50px -20px rgb(10 30 30 / .55) }
  .toys[hidden]{ display:none }
  .toys h2{ font:500 .68rem/1 var(--mono); letter-spacing:.14em; color:var(--ink-2); padding:.7rem .6rem .45rem }
  .toys ol{ list-style:none }
  .toys button{ display:grid; grid-template-columns:2rem 1fr auto; align-items:center; gap:.6rem; width:100%; text-align:left; background:none; border:0; border-radius:10px; padding:.5rem .55rem; cursor:pointer; color:var(--ink); font-family:var(--display) }
  .toys button:hover, .toys button:focus-visible{ background:rgb(16 40 43 / .06); outline:none }
  .toys .num{ display:grid; place-items:center; width:1.75rem; height:1.75rem; border-radius:999px; background:var(--deep); color:var(--cream); font:700 .72rem/1 var(--mono) }
  .toys b{ display:block; font-weight:700; font-size:.95rem; letter-spacing:-.01em }
  .toys small{ display:block; font-size:.8rem; color:var(--ink-2); margin-top:.1rem }
  .toys .new{ font:700 .62rem/1 var(--mono); letter-spacing:.1em; color:var(--deep); background:rgb(43 176 174 / .16); border-radius:999px; padding:.3rem .45rem }

  .mini{ right:16px; bottom:max(16px, env(safe-area-inset-bottom)) }
  .mini canvas{ display:block; width:200px; height:134px; border-radius:12px; border:2px solid var(--cream); box-shadow:0 8px 24px -12px rgb(10 40 30 / .6); cursor:crosshair; touch-action:none }
  .toys-btn:focus-visible, .sound:focus-visible, .links a:focus-visible, .mark:focus-visible{ outline:2px solid var(--cream); outline-offset:2px }

  /* garage: the engine panel sits at the bottom so the car stays in view */
  .engine{ left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:8 }
  .engine[hidden]{ display:none }
  .eng-card{ position:relative; width:min(400px, calc(100vw - 32px)); background:var(--cream); border:1px solid var(--line); border-radius:18px; padding:1rem 1rem .9rem; box-shadow:0 26px 50px -20px rgb(10 30 30 / .6) }
  .eng-card .kicker{ font:500 .66rem/1.3 var(--mono); letter-spacing:.14em; color:var(--ink-2); padding-right:2.4rem }
  .eng-card h2{ margin-top:.2rem; font-weight:800; font-style:italic; font-size:1.45rem; letter-spacing:-.03em; line-height:1.05 }
  .eng-card .spec{ margin-top:.2rem; font:500 .74rem/1.3 var(--mono); color:var(--ink-2) }
  .eng-card canvas{ display:block; width:100%; height:auto; margin-top:.7rem; border-radius:12px; background:#14262a }
  .eng-actions{ display:flex; gap:.5rem; margin-top:.7rem }
  .eng-actions button{ font:600 .95rem/1 var(--display); padding:.85rem 1rem; border-radius:12px; cursor:pointer; border:1px solid var(--ink) }
  .key{ background:transparent; color:var(--ink); min-width:6.5rem }
  .key.is-on{ background:var(--coral); border-color:var(--coral) }
  .gas{ flex:1; background:var(--ink); color:var(--cream); user-select:none; -webkit-user-select:none; touch-action:none }
  .gas[disabled]{ opacity:.35; cursor:default }
  .gas.is-held{ background:var(--teal); border-color:var(--teal); color:var(--ink) }
  .eng-note{ margin-top:.55rem; font:500 .66rem/1.4 var(--mono); letter-spacing:.06em; color:var(--ink-2) }
  @media (hover:none){ .eng-note .kbd{ display:none } }
  .x{ position:absolute; top:.7rem; right:.7rem; width:2.1rem; height:2.1rem; border-radius:999px; border:1px solid var(--line); background:transparent; font-size:1.15rem; line-height:1; cursor:pointer; color:var(--ink) }
  .x:hover{ background:rgb(16 40 43 / .06) }

  @media (max-width:640px){
    .mini{ display:none }
    .links{ display:none }
    .hint .pill{ font-size:.66rem }
    .toys{ max-height:60vh }
    .engine{ bottom:calc(max(16px, env(safe-area-inset-bottom)) + 58px) }
  }
</style>
</head>
<body>

<canvas id="world" tabindex="0" role="img" aria-label="A meadow you can pan around, with toys: a pond for skipping stones, a frog catching flies, a garage where you can start and rev three vehicles, a merry-go-round, a flower field, a lamp post that turns the day to night, a football pitch, musical stepping stones, a drag strip with launch lights, a kite, bubbles, pinwheels and six things hidden in bushes. The toys button lists them all and jumps to each."></canvas>

<div class="hud top">
  <div class="left"><a class="mark pill" href="index.html">hrishikesh <small>playground</small></a><span class="wip pill">work in progress</span></div>
  <div class="right">
    <button class="sound" type="button" id="sound" aria-pressed="true">sound</button>
    <nav class="links pill" aria-label="Site"><a href="index.html#works">works</a><a href="about.html">about</a><a href="index.html#contact">contact</a></nav>
  </div>
</div>
<div class="hud hint" id="hint"><span class="pill">drag to look around · tap things to play</span></div>
<div class="hud toast" id="toast" aria-live="polite"><span class="pill" id="toast-text"></span></div>

<div class="hud dock">
  <div class="toys" id="toys" hidden>
    <h2>all toys · tap one to go there</h2>
    <ol id="toy-list"></ol>
  </div>
  <button class="toys-btn" type="button" id="toys-btn" aria-expanded="false" aria-controls="toys">toys <span>13</span></button>
</div>
<div class="hud mini"><canvas id="mini" width="200" height="134" aria-label="Map. Click to jump there."></canvas></div>

<div class="hud engine" id="engine" hidden>
  <div class="eng-card" role="dialog" aria-labelledby="eng-name">
    <button class="x" type="button" id="eng-close" aria-label="Close and switch off">×</button>
    <p class="kicker">garage</p>
    <h2 id="eng-name">octavia mk2 1.8 tsi</h2>
    <p class="spec" id="eng-spec"></p>
    <canvas id="tach" width="640" height="300" aria-hidden="true"></canvas>
    <div class="eng-actions"><button class="key" type="button" id="eng-key">start</button><button class="gas" type="button" id="eng-gas" disabled>hold to rev</button></div>
    <p class="eng-note" id="eng-note"><span class="kbd">space revs · s starts and stops · </span>tap the vehicle to blip</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================================================================
     World, camera, helpers
     ================================================================ */
  var W = 4800, H = 3200;
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('world'), ctx = cv.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var cam = { x: 0, y: 0, z: 1, vx: 0, vy: 0, fly: null };
  var ZMIN = 0.4, ZMAX = 1.6;
  var T = 0;

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  var R = rng(20261026);
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2); }
  function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
  function canvasOf(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  var store = {};
  try { store = JSON.parse(localStorage.getItem('pg-v3') || '{}') || {}; } catch (e) { store = {}; }
  function save() { try { localStorage.setItem('pg-v3', JSON.stringify(store)); } catch (e) { /* storage off: scores just don't stick */ } }

  /* ================================================================
     Sound (Web Audio, made on the first tap)
     ================================================================ */
  var AC = null, soundOn = store.sound !== false;
  var soundBtn = document.getElementById('sound');
  function paintSound() { soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.textContent = soundOn ? 'sound on' : 'sound off'; }
  paintSound();
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn; store.sound = soundOn; save(); paintSound();
    if (engGain) engGain.gain.value = soundOn ? ENG_LEVEL : 0;
    if (soundOn) note(523.25);
  });
  function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, dur, type, gain, when, to) {
    if (!soundOn) return;
    var a = audio(); if (!a) return;
    var t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.8);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain || 0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function note(f) { tone(f, 0.9, 'sine', 0.2); tone(f * 4, 0.22, 'sine', 0.035); }
  function plip() { tone(1100, 0.14, 'sine', 0.12, 0, 380); }

  /* ================================================================
     Engine sound: a firing-pulse synth running in an AudioWorklet.
     Each cylinder firing kicks a decaying, slightly noisy pulse; the pulses
     ring through a few exhaust resonances, then soft-clip and darken.
     The firing rate follows rpm (4-stroke: cylinders x rpm / 120 per second).
     ================================================================ */
  var WORKLET_SRC = [
    'class Engine extends AudioWorkletProcessor {',
    '  constructor(options) {',
    '    super();',
    '    this.p = { on: 0, rpm: 0, thr: 0, boost: 0, crank: 0, cut: 0, cyl: 4, exh: [[100, 1.4, 1]], tau: 0.003, jit: 0.06, drive: 1.5, noise: 0.06, turbo: 0, crackle: 0, dark: 0.3, gain: 0.7 };',
    '    this.phase = 0; this.env = 0; this.seed = 12345; this.wh = 0; this.st = 0; this.bov = 0; this.lp = 0; this.lp2 = 0; this.wa = 0; this.wb = 0; this.bovN = 0;',
    '    this.srcs = []; this.grains = []; this.gClock = 0; this.gLen = Math.round(0.075 * sampleRate); this.gHop = Math.round(this.gLen / 3);',
    '    this.tv = []; this.tampT = 1; this.tampS = 1; this.sLen = Math.round(0.09 * sampleRate);',
    '    if (options && options.processorOptions && options.processorOptions.p) Object.assign(this.p, options.processorOptions.p);',
    '    if (options && options.processorOptions && options.processorOptions.srcs) this.srcs = options.processorOptions.srcs;',
    '    this.rpmS = this.p.on ? this.p.rpm : 0; this.thrS = this.p.thr; this.boostS = this.p.boost;',
    '    this.setF();',
    '    this.port.onmessage = (e) => { const d = e.data; if (d.p) { const ex = d.p.exh; Object.assign(this.p, d.p); if (ex) this.setF(); } if (d.bov) this.bov = d.bov; if (d.src) this.srcs[d.src.id] = d.src.data;',
    '      if (d.tape && this.srcs[d.tape.s]) { const t = d.tape, xf = Math.max(64, t.xf | 0); this.tv.forEach((v) => { v.d = -1 / xf; }); this.tv.push({ b: this.srcs[t.s], pos: t.pos, rate: t.rate, rT: t.rate, x: 0, d: 1 / xf, sus: t.sus || null, scan: t.scan || 1, gc: 0, gr: [] }); if (this.tv.length > 4) this.tv.shift(); }',
    '      if (d.trate) { const v = this.tv[this.tv.length - 1]; if (v) { v.rT = d.trate; v.rk = 1 / ((d.trs || 0.045) * sampleRate); } }',
    '      if (d.tamp !== undefined) this.tampT = d.tamp; };',
    '  }',
    '  rnd() { this.seed = (this.seed * 16807) % 2147483647; return this.seed / 2147483647; }',
    '  bp(fr, q, g) { const w = 2 * Math.PI * fr / sampleRate, a = Math.sin(w) / (2 * q), c = Math.cos(w), a0 = 1 + a; return { b0: a / a0, b2: -a / a0, a1: -2 * c / a0, a2: (1 - a) / a0, g: g, x1: 0, x2: 0, y1: 0, y2: 0 }; }',
    '  run(f, x) { const y = f.b0 * x + f.b2 * f.x2 - f.a1 * f.y1 - f.a2 * f.y2; f.x2 = f.x1; f.x1 = x; f.y2 = f.y1; f.y1 = y; return y; }',
    '  setF() { this.f = this.p.exh.map((e) => this.bp(e[0], e[1], e[2])); this.inF = this.bp(1300, 0.8, 1); this.bovF = this.bp(3200, 1.1, 1); }',
    /* shared by both recorded voices: turbo whistle, blow-off whoosh, optional darkening, soft limit */
    '  post(y, p, k1) {',
    '    const sr = sampleRate, nr = this.rnd() * 2 - 1;',
    '    if (p.turbo) { this.wh += (1800 + 6500 * this.boostS) / sr; if (this.wh > 1) this.wh -= 1; y += Math.sin(6.283185 * this.wh) * this.boostS * this.boostS * 0.035; }',
    '    if (this.bov > 0.002) { this.bovN += (this.run(this.bovF, nr) - this.bovN) * (0.25 + 0.6 * this.bov); y += this.bovN * this.bov * 2.2; this.bov *= Math.exp(-1 / (0.5 * sr)); }',
    '    if (p.dark > 0) { this.lp += (y - this.lp) * k1; this.lp2 += (this.lp - this.lp2) * k1; y = this.lp2; }',
    '    return Math.tanh(y * 1.1) * p.gain;',
    '  }',
    '  process(inputs, outputs) {',
    '    const out = outputs[0][0]; if (!out) return true;',
    '    const p = this.p, sr = sampleRate, decay = Math.exp(-1 / (p.tau * sr)), k1 = 0.55 - 0.4 * p.dark;',
    '    for (let i = 0; i < out.length; i++) {',
    '      this.rpmS += ((p.on ? p.rpm : 0) - this.rpmS) * 0.003;',
    '      this.thrS += (p.thr - this.thrS) * 0.003;',
    '      this.boostS += (p.boost - this.boostS) * 0.002;',
    '      const rpm = this.rpmS, thr = this.thrS, cyl = p.cyl;',
    '      if (p.ev) {',
    /* electric: motor whine and an inverter tone that both track motor speed, plus road hush */
    '        let e = 0;',
    '        if (p.on) {',
    '          this.wa += rpm * 0.12 / sr; if (this.wa > 1) this.wa -= 1;',
    '          this.wb += rpm * 0.37 / sr; if (this.wb > 1) this.wb -= 1;',
    '          const lvl = Math.min(1, rpm / 1500) * (0.3 + 0.7 * thr);',
    '          e = Math.sin(6.283185 * this.wa) * 0.2 * lvl + Math.sin(12.56637 * this.wa) * 0.05 * lvl + Math.sin(6.283185 * this.wb) * 0.05 * lvl;',
    '          const n2 = this.rnd() * 2 - 1; this.lp += (n2 - this.lp) * 0.03; e += this.lp * 0.5 * Math.min(1, rpm / 9000);',
    '        }',
    '        out[i] = e * p.gain; continue;',
    '      }',
    /* recorded: overlapping 75 ms slices of his own recording, taken from where the engine was at this rpm,
       nudged to the exact pitch; the main thread says where to read (gpos) and how fast (grate) */
    '      if (p.tape) {',
    /* tape: his recording played straight through at (close to) its own speed; the main thread picks
       which real rise, fall or idle to play and jumps between them with short crossfades. At the top of a
       rev it holds on the peak by drawing 90 ms slices from around it (sus). */
    '        let y = 0;',
    '        this.tampS += (this.tampT - this.tampS) * 0.002;',
    '        for (let q = this.tv.length - 1; q >= 0; q--) {',
    '          const v = this.tv[q];',
    '          v.x += v.d; if (v.x > 1) v.x = 1;',
    '          if (v.x <= 0 && v.d < 0) { this.tv.splice(q, 1); continue; }',
    '          v.rate += (v.rT - v.rate) * (v.rk || 0.0005);',
    '          const g = Math.sin(v.x * 1.5707963);',
    '          if (!v.sus && v.scan <= 1) {',
    '            const i0 = v.pos | 0;',
    '            if (i0 + 2 >= v.b.length) { if (v.d > 0) v.d = -1 / 512; continue; }',
    '            const fr = v.pos - i0; y += (v.b[i0] * (1 - fr) + v.b[i0 + 1] * fr) * g; v.pos += v.rate;',

    function (g) { g.fillStyle = '#2f5d5c'; g.fillRect(-14, -18, 28, 36); g.fillStyle = '#fbf7ea'; g.fillRect(-11, -15, 22, 30); g.fillStyle = '#9aa29f'; for (var i = 0; i < 6; i++) { circ(g, -14, -14 + i * 6, 2); g.fill(); } g.strokeStyle = '#f2785c'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-6, 6); g.quadraticCurveTo(0, -10, 7, 4); g.stroke(); },

  function drawBushes() {

  function frame(now) {
