<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>
  /* GitHub Pages serves this page at whatever address was asked for, so relative links need the site's root */
  (function () { var m = location.pathname.match(/^\/portfolio\//); if (location.hostname.slice(-10) === '.github.io' && m) { document.write('<base href="/portfolio/">'); } })();
</script>
<title>Page not found — Hrishikesh Nanda</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600&display=swap">
<style>
  *{ box-sizing:border-box; margin:0; padding:0 }
  html, body{ height:100%; overflow:hidden; background:#2f6a46; font-family:"Archivo", Arial, sans-serif; color:#10282b }
  iframe{ position:fixed; inset:0; width:100%; height:100%; border:0 }
  .card{ position:fixed; left:50%; top:50%; transform:translate(-50%, -50%); width:min(26rem, calc(100% - 32px)); padding:1.75rem 1.75rem 1.5rem;
    background:rgb(251 247 234 / .92); border:1px solid rgb(16 40 43 / .14); border-radius:22px;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:0 20px 50px -24px rgb(10 40 30 / .6) }
  .eyebrow{ font:500 .8rem/1 "JetBrains Mono", monospace; color:#47605f; letter-spacing:.02em }
  h1{ margin:.6rem 0 .5rem; font-size:1.9rem; font-weight:800; font-style:italic; letter-spacing:-.03em }
  p{ color:#47605f; line-height:1.5 }
  .row{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.25rem }
  .row a{ display:inline-flex; align-items:center; gap:.4rem; padding:.65rem 1.1rem; border-radius:999px; font:600 .9rem/1 "JetBrains Mono", monospace; text-decoration:none }
  .solid{ background:#10282b; color:#fbf7ea }
  .line{ border:1px solid #10282b; color:#10282b }
</style>
</head>
<body>
<iframe src="playground.html" title="The playground" tabindex="-1" id="pg"></iframe>
<div class="card" role="main">
  <p class="eyebrow">404</p>
  <h1>this page took a wrong turn</h1>
  <p>Nothing lives at this address. You ended up in the playground instead.</p>
  <div class="row">
    <a class="solid" href="index.html">back to the work &rarr;</a>
    <a class="line" href="playground.html" id="stay">stay and play</a>
  </div>
</div>
<script>
  /* hide the playground's own controls behind the card; "stay and play" removes the card */
  var f = document.getElementById('pg');
  f.addEventListener('load', function () { try { var d = f.contentDocument, s = d.createElement('style'); s.id = 'quiet'; s.textContent = '.hud{ display:none !important }'; d.head.appendChild(s); } catch (e) {} });
  document.getElementById('stay').addEventListener('click', function (e) { e.preventDefault(); document.querySelector('.card').remove(); try { f.contentDocument.getElementById('quiet').remove(); } catch (er) {} f.focus(); });
</script>
</body>
</html>
